<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Louis</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Louis">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <link rel="manifest" href="./manifest.json">

  <!-- Warm Luxury Typography (Matching Gym & DCR Ledger) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Sepia & Warm Design System Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="ios-app-container">
    <!-- Top iOS Executive Navigation Bar -->
    <header class="ios-header">
      <div class="ios-header-content">
        <div class="ios-brand-group">
          <div class="ios-brand-avatar" aria-hidden="true" title="Louis">
            <svg viewBox="0 0 40 40" width="24" height="24" fill="none">
              <defs>
                <linearGradient id="headerGold" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#F3E5C8" />
                  <stop offset="35%" stop-color="#D9B76D" />
                  <stop offset="70%" stop-color="#B68628" />
                  <stop offset="100%" stop-color="#8F6317" />
                </linearGradient>
              </defs>
              <!-- Left Pillar with serifs -->
              <path d="M7 8.5h6c-0.8 1-1.2 2-1.2 3.8v15.4c0 1.8 0.4 2.8 1.2 3.8H7c0.8-1 1.2-2 1.2-3.8V12.3C8.2 10.5 7.8 9.5 7 8.5z" fill="url(#headerGold)"/>
              <!-- Right Pillar with serifs -->
              <path d="M27 8.5h6c-0.8 1-1.2 2-1.2 3.8v15.4c0 1.8 0.4 2.8 1.2 3.8h-6c0.8-1 1.2-2 1.2-3.8V12.3c0-1.8-0.4-2.8-1.2-3.8z" fill="url(#headerGold)"/>
              <!-- Bold Diagonal Downstroke -->
              <polygon points="10,9.8 20,26.5 21.8,26.5 13.5,9.8" fill="url(#headerGold)"/>
              <!-- Slender Diagonal Upstroke -->
              <polygon points="19.5,26.5 21,26.5 29.5,9.8 28.2,9.8" fill="url(#headerGold)"/>
              <!-- Apex Keystone Diamond -->
              <polygon points="20,26.8 21.2,28.3 20,29.8 18.8,28.3" fill="#FFF4DE"/>
            </svg>
          </div>
          <div class="ios-header-titles">
            <span class="ios-executive-badge">Executive Brief</span>
            <h1 class="ios-app-title">Louis</h1>
          </div>
        </div>

        <div class="ios-header-actions">
          <button class="ios-icon-btn" id="btn-open-settings" aria-label="Connection Settings & Sync" title="Connection Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span class="sync-dot" id="header-sync-indicator" title="Connected"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Pull-to-Refresh Activity Indicator -->
    <div class="ptr-indicator" id="ptr-indicator">
      <div class="ptr-pill">
        <div class="ptr-spinner" id="ptr-spinner">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#0A2540" stroke-width="2.5" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
          </svg>
        </div>
        <span class="ptr-text">Updating from Sheets...</span>
      </div>
    </div>

    <!-- Scrollable Main Viewport -->
    <main class="ios-main-content" id="main-scroll-container">
      <!-- VIEW 1: Daily Briefing Feed -->
      <section class="view-container is-active" id="view-daily">
        <!-- Expandable Calendar Mount -->
        <div id="calendar-mount"></div>
        <!-- Daily Briefing Content Mount -->
        <div id="daily-content-mount"></div>
      </section>

      <!-- VIEW 2: Weekly Synthesis & Trends -->
      <section class="view-container" id="view-synthesis">
        <div id="synthesis-content-mount"></div>
      </section>
    </main>

    <!-- iOS Native Bottom Tab Bar -->
    <nav class="ios-tab-bar" aria-label="Main Navigation">
      <button class="ios-tab-item is-active" id="tab-daily" data-view="view-daily" aria-selected="true">
        <div class="ios-tab-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <span class="ios-tab-label">Daily Briefing</span>
      </button>

      <button class="ios-tab-item" id="tab-synthesis" data-view="view-synthesis" aria-selected="false">
        <div class="ios-tab-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
        </div>
        <span class="ios-tab-label">Weekly Synthesis</span>
      </button>
    </nav>

    <!-- Settings Bottom Sheet Modal -->
    <div class="settings-overlay" id="settings-overlay" aria-hidden="true">
      <div class="settings-sheet" id="settings-sheet" role="dialog" aria-labelledby="settings-heading">
        <div class="ios-sheet-handle"></div>
        <div class="settings-header">
          <h3 class="settings-title" id="settings-heading">Data Source & Sync</h3>
          <button class="settings-close-btn" id="btn-close-settings">Done</button>
        </div>

        <div class="settings-status-box">
          <span class="status-pill status-cached" id="sync-status-display">Active: Local Cache</span>
          <div class="status-time" id="sync-timestamp-display">Last sync: Initialized</div>
        </div>

        <div class="settings-form-group">
          <label class="settings-label" for="input-appscript-url">Google Sheet Link or Apps Script URL</label>
          <div class="settings-input-wrapper">
            <input 
              type="url" 
              id="input-appscript-url" 
              class="settings-input" 
              placeholder="Paste Google Sheet link or Apps Script URL"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
            >
            <button type="button" class="btn-paste-ios" id="btn-paste-url" title="Paste from clipboard">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Paste</span>
            </button>
          </div>
          <p class="settings-hint">
            Paste your Google Sheet link or your deployed Google Apps Script Web App URL.
          </p>
        </div>

        <div class="settings-actions">
          <button class="btn-primary-ios" id="btn-save-settings">Save & Re-sync</button>
          <button class="btn-secondary-ios" id="btn-sync-now">Sync Now</button>
          <button class="btn-secondary-ios" id="btn-check-ota">Check for App Updates</button>
          <button class="btn-danger-ios" id="btn-reset-sample">Reset to Sample Briefings</button>
        </div>

        <div class="modal-toast" id="modal-toast-note"></div>
      </div>
    </div>
  </div>

  <!-- Main ES6 Application Controller -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
